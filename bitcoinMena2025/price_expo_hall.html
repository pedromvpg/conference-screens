<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expo Hall Bitcoin Price Display - Bitcoin MENA 2025</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .video-background {
            position: fixed;
            top: 0;
            width: 70vw;
            width: 460px;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            /* margin-left: -35%; */
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 0;
        }
        .price-value {
            font-size: 45px;
        }
        
        .currency {
            font-size: 20px;
        }
        .sponsor-logo {
            max-width: 256px;
            margin-right: -11px;
        }
        @media (max-width: 768px) {
            .currency {
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .price-value {
                flex-direction: row;
            }
        }



        .price-value {
            gap: 5px;
        }

        


        .sponsor-section {
            gap: 5px;
        }

        .chart-section {
            width: 30vh !important;
            height: 12vh !important;
            margin-top: -4vh;
        }

        .chart-container {
            height: 14vh !important;
        }


        .container{
            margin-top: -15vh;
        }

        .top-logo {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 12vh;
        }

<body>
    <!-- Video Background -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="price_expo_v2.mp4" type="video/mp4">
    </video>
    

    <div class="container">

        <img src="mena_antalpha.png" alt="MENA Antalpha" class="top-logo">

            <div class="price-display">
                <div class="bitcoin-title">1&nbsp;Bitcoin</div>
                <div class="price-value" id="price-value">
                    <div class="loading-spinner" id="loading-spinner"></div>
                    <span id="price" style="display: none;">116,015</span>
                    <span class="currency">USD</span>
                </div>
                <div class="error-message" id="error-message" style="display: none;"></div>
            </div>

            <div class="ytd-header">YTD</div>

            <div class="chart-section">
                <div class="chart-container">
                    <canvas id="price-chart"></canvas>
                </div>
            </div>

            <div class="sponsor-section">
                <div class="sponsor-label">Sponsored&nbsp;by</div>
                <img style="margin-top: 0.8vw;" src="https://i.ibb.co/GQ9Mv07z/image.png" 
                    loading="lazy" 
                    alt="SALT Logo" 
                    class="sponsor-logo">
            </div>

    <div class="last-updated" id="last-updated"></div>
    
    <!-- URL Parameters Control -->
    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        // Handle video background
        const videoParam = urlParams.get('video');
        if (videoParam) {
            const videoElement = document.querySelector('.video-background');
            const sourceElement = videoElement.querySelector('source');
            if (videoElement && sourceElement) {
                sourceElement.src = decodeURIComponent(videoParam);
                videoElement.load();
            }
        }
        
        // Handle chart visibility (chart=hide or chart=false)
        const chartParam = urlParams.get('chart');
        if (chartParam === 'hide' || chartParam === 'false') {
            const chartSection = document.querySelector('.chart-section');
            const ytdHeader = document.querySelector('.ytd-header');
            if (chartSection) chartSection.style.display = 'none';
            if (ytdHeader) ytdHeader.style.display = 'none';
        }
        
        // Handle layout direction (layout=row or layout=row-inline)
        const layoutParam = urlParams.get('layout');
        const reverseParam = urlParams.get('reverse');
        
        if (layoutParam === 'row') {
            const container = document.querySelector('.container');
            if (container) {
                container.style.flexDirection = reverseParam === 'true' ? 'row-reverse' : 'row';
                container.style.justifyContent = 'center';
                container.style.textAlign = 'left';
                container.style.alignItems = 'flex-start';
            }
            
            // Apply row-specific styles
            const priceValue = document.querySelector('.price-value');
            if (priceValue) {
                priceValue.style.fontSize = '8vw';
                priceValue.style.flexDirection = 'row';
                priceValue.style.gap = '1vw';
            }
            
            const currency = document.querySelector('.currency');
            if (currency) currency.style.fontSize = '4vw';
            
            const sponsorLogo = document.querySelector('.sponsor-logo');
            if (sponsorLogo) sponsorLogo.style.maxWidth = '30vw';
            
            const sponsorSection = document.querySelector('.sponsor-section');
            if (sponsorSection) {
                sponsorSection.style.gap = '0';
                sponsorSection.style.textAlign = 'left';
                sponsorSection.style.alignItems = 'flex-start';
            }
            
            const sponsorLabel = document.querySelector('.sponsor-label');
            if (sponsorLabel) {
                sponsorLabel.style.marginBottom = '0.5vw';
                sponsorLabel.style.fontSize = '1.5vw';
            }
            
            const bitcoinTitle = document.querySelector('.bitcoin-title');
            if (bitcoinTitle) bitcoinTitle.style.fontSize = '1.5vw';
        }
        
        // Handle row-inline layout
        if (layoutParam === 'row-inline') {
            const container = document.querySelector('.container');
            if (container) {
                container.style.flexDirection = reverseParam === 'true' ? 'row-reverse' : 'row';
                container.style.justifyContent = 'center';
                container.style.textAlign = 'left';
                container.style.alignItems = 'flex-end';
                container.style.gap = '3vw';
            }
            
            // Price display with inline title
            const priceDisplay = document.querySelector('.price-display');
            if (priceDisplay) {
                priceDisplay.style.display = 'flex';
                priceDisplay.style.flexDirection = 'row';
                priceDisplay.style.alignItems = 'flex-end';
                priceDisplay.style.gap = '1vw';
            }
            
            const bitcoinTitle = document.querySelector('.bitcoin-title');
            if (bitcoinTitle) {
                bitcoinTitle.style.fontSize = '1.5vw';
                bitcoinTitle.style.marginBottom = '0.5vw';
            }
            
            const priceValue = document.querySelector('.price-value');
            if (priceValue) {
                priceValue.style.fontSize = '7vw';
                priceValue.style.flexDirection = 'row';
                priceValue.style.gap = '1vw';
            }
            
            const priceNumber = document.querySelector('#price');
            if (priceNumber) priceNumber.style.fontSize = '6.5vw';
            
            const currency = document.querySelector('.currency');
            if (currency) currency.style.fontSize = '4vw';
            
            // Sponsor section with inline label
            const sponsorSection = document.querySelector('.sponsor-section');
            if (sponsorSection) {
                sponsorSection.style.display = 'flex';
                sponsorSection.style.flexDirection = 'row';
                sponsorSection.style.alignItems = 'flex-end';
                sponsorSection.style.alignContent = 'flex-end';
                sponsorSection.style.gap = '1vw';
            }
            
            const sponsorLabel = document.querySelector('.sponsor-label');
            if (sponsorLabel) {
                sponsorLabel.style.fontSize = '1.5vw';
                sponsorLabel.style.marginBottom = '0.5vw';
            }
            
            const sponsorLogo = document.querySelector('.sponsor-logo');
            if (sponsorLogo) {
                sponsorLogo.style.maxWidth = '25vw';
                sponsorLogo.style.marginBottom = '0.6vw';
            }
        }
    </script>
    
    <script src="refresh.js?screen=mena25ExpoHallPrice"></script>
    <script src="price.js"></script>
    <!-- Screen Control -->
    <script src="screen-control.js"></script>
</body>
