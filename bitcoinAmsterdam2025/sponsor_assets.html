<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsor Assets & Images - Bitcoin Amsterdam 2025</title>
    <link rel="stylesheet" href="styles.css">
    <!-- JSZip for creating ZIP files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #ff6600;
            margin-bottom: 20px;
        }
        h2 {
            color: #ff8c00;
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff6600;
        }
        .status {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            border-left: 3px solid #ff6600;
        }
        .status.loading {
            border-left-color: #4da6ff;
        }
        .status.success {
            border-left-color: #4caf50;
        }
        .status.error {
            border-left-color: #f44336;
        }
        .controls {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            background: #ff6600;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .btn:hover {
            background: #ff8800;
        }
        .btn-secondary {
            background: #555;
        }
        .btn-secondary:hover {
            background: #666;
        }
        .sponsors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .sponsor-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .sponsor-card:hover {
            border-color: #ff6600;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }
        .sponsor-image-container {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 4px;
            margin-bottom: 10px;
            overflow: hidden;
            padding: 10px;
        }
        .sponsor-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #fff;
        }
        .sponsor-image.placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            color: #666;
            font-size: 0.8rem;
        }
        .sponsor-name {
            font-weight: 600;
            color: #ff8c00;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .sponsor-tier {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 10px;
        }
        .sponsor-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .sponsor-actions a, .sponsor-actions button {
            flex: 1;
            min-width: 80px;
            font-size: 0.75rem;
            padding: 6px 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .summary {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .summary-item {
            flex: 1;
            min-width: 150px;
        }
        .summary-item strong {
            color: #ff6600;
            font-size: 1.5rem;
            display: block;
        }
        .summary-item span {
            color: #888;
            font-size: 0.9rem;
        }
        #loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-top: 3px solid #ff6600;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .filter-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-controls select, .filter-controls input {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sponsor Assets & Images</h1>
        
        <div id="status" class="status loading">
            <div id="loading-spinner"></div>
            <strong>Loading sponsors...</strong>
            <p id="status-message" style="margin: 5px 0 0 0;">Fetching data from Airtable...</p>
        </div>

        <div class="controls" style="display: none;" id="controls">
            <div class="filter-controls">
                <label style="color: #888;">Filter by tier:</label>
                <select id="tier-filter" onchange="filterSponsors()">
                    <option value="all">All Tiers</option>
                    <option value="AMS25 - Title">Title</option>
                    <option value="AMS25 - Moon">Moon</option>
                    <option value="AMS25 - 3 Block">3 Block</option>
                    <option value="AMS25 - 2 Block">2 Block</option>
                    <option value="AMS25 - 1 Block">1 Block</option>
                </select>
                
                <label style="color: #888; margin-left: 20px;">Search:</label>
                <input type="text" id="search-input" placeholder="Search by name..." oninput="filterSponsors()">
            </div>
            
            <div style="display: flex; gap: 10px; margin-left: auto;">
                <button class="btn" onclick="downloadAsZip()" id="zip-btn">
                    Download ZIP (Best)
                </button>
                <button class="btn btn-secondary" onclick="downloadSequentially()">
                    Download Sequentially
                </button>
                <button class="btn btn-secondary" onclick="exportUrlList()">
                    Export URL List
                </button>
                <button class="btn btn-secondary" onclick="copyUrlsToClipboard()">
                    Copy URLs
                </button>
            </div>
        </div>

        <div class="summary" style="display: none;" id="summary">
            <div class="summary-item">
                <strong id="total-count">0</strong>
                <span>Total Sponsors</span>
            </div>
            <div class="summary-item">
                <strong id="with-images-count">0</strong>
                <span>With Images</span>
            </div>
            <div class="summary-item">
                <strong id="without-images-count">0</strong>
                <span>Without Images</span>
            </div>
        </div>

        <div id="sponsors-container"></div>
    </div>

    <!-- Configuration (optional - will use URL params or localStorage if not present) -->
    <script src="config.js" onerror="console.log('config.js not found, will use URL parameters or localStorage')"></script>
    
    <script>
        let allSponsors = [];
        let filteredSponsors = [];

        // Airtable configuration - same as script.js
        function getAirtableConfig() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 1. Try URL parameters
            let accessToken = urlParams.get('sponsorsAccessToken') || urlParams.get('accessToken');
            let baseId = urlParams.get('sponsorsBaseId') || urlParams.get('baseId');
            let tableName = urlParams.get('sponsorsTableName') || urlParams.get('tableName');
            
            if (accessToken && baseId && tableName) {
                console.log('✅ Using Airtable config from URL parameters');
                return { accessToken, baseId, tableName };
            }
            
            // 2. Try localStorage
            accessToken = localStorage.getItem('airtable_sponsors_accessToken');
            baseId = localStorage.getItem('airtable_sponsors_baseId');
            tableName = localStorage.getItem('airtable_sponsors_tableName');
            
            if (accessToken && baseId && tableName) {
                console.log('✅ Using Airtable config from localStorage');
                return { accessToken, baseId, tableName };
            }
            
            // 3. Try CONFIG object
            if (typeof CONFIG !== 'undefined' && CONFIG.sponsors) {
                console.log('✅ Using Airtable config from CONFIG object');
                return CONFIG.sponsors;
            }
            
            return null;
        }

        const AIRTABLE_CONFIG = getAirtableConfig();

        // Filter values
        const FILTER_VALUES = [
            'AMS25 - Title',
            'AMS25 - Moon',
            'AMS25 - 3 Block',
            'AMS25 - 2 Block',
            'AMS25 - 1 Block'
        ];

        // Fetch sponsors from Airtable
        async function fetchSponsors() {
            if (!AIRTABLE_CONFIG) {
                showError('No Airtable configuration found. Please provide credentials via URL parameters or localStorage.');
                return;
            }

            try {
                updateStatus('Fetching sponsors from Airtable...', 'loading');
                
                let allRecords = [];
                let offset = null;
                let pageCount = 0;
                
                do {
                    pageCount++;
                    let url = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${AIRTABLE_CONFIG.tableName}`;
                    
                    const params = new URLSearchParams();
                    if (offset) params.append('offset', offset);
                    params.append('pageSize', '100');
                    
                    if (params.toString()) url += '?' + params.toString();
                    
                    updateStatus(`Fetching page ${pageCount}... (${allRecords.length} sponsors so far)`, 'loading');
                    
                    const response = await fetch(url, {
                        headers: {
                            'Authorization': `Bearer ${AIRTABLE_CONFIG.accessToken}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    allRecords = allRecords.concat(data.records || []);
                    offset = data.offset;
                    
                } while (offset);
                
                // Filter records
                const filtered = allRecords.filter(record => {
                    const AMS25Value = record.fields.AMS25;
                    if (!AMS25Value) return false;
                    
                    if (Array.isArray(AMS25Value)) {
                        return AMS25Value.some(value => FILTER_VALUES.includes(value));
                    } else {
                        return FILTER_VALUES.includes(AMS25Value);
                    }
                });
                
                allSponsors = filtered.map(record => ({
                    id: record.id,
                    name: record.fields.Name || 'Unknown Sponsor',
                    tier: Array.isArray(record.fields.AMS25) ? record.fields.AMS25[0] : record.fields.AMS25,
                    imageUrl: record.fields['Webflow Original Image URL'] || '',
                    logoScale: record.fields['Logo Scale'] || 1,
                    hasImage: !!(record.fields['Webflow Original Image URL'])
                }));
                
                // Sort by tier and name
                allSponsors.sort((a, b) => {
                    const tierOrder = {
                        'AMS25 - Title': 1,
                        'AMS25 - Moon': 2,
                        'AMS25 - 3 Block': 3,
                        'AMS25 - 2 Block': 4,
                        'AMS25 - 1 Block': 5
                    };
                    const tierDiff = (tierOrder[a.tier] || 999) - (tierOrder[b.tier] || 999);
                    if (tierDiff !== 0) return tierDiff;
                    return a.name.localeCompare(b.name);
                });
                
                filteredSponsors = [...allSponsors];
                
                updateStatus(`Successfully loaded ${allSponsors.length} sponsors!`, 'success');
                displaySponsors();
                updateSummary();
                
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('summary').style.display = 'flex';
                
            } catch (error) {
                console.error('Error fetching sponsors:', error);
                showError(`Failed to fetch sponsors: ${error.message}`);
            }
        }

        function updateStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            const messageDiv = document.getElementById('status-message');
            const spinner = document.getElementById('loading-spinner');
            
            statusDiv.className = `status ${type}`;
            messageDiv.textContent = message;
            spinner.style.display = type === 'loading' ? 'inline-block' : 'none';
        }

        function showError(message) {
            updateStatus(message, 'error');
            document.getElementById('status').innerHTML = `
                <strong>Error</strong>
                <p style="margin: 5px 0 0 0;">${message}</p>
                <p style="margin: 10px 0 0 0; font-size: 0.9em;">
                    <a href="index.html" style="color: #ff6600;">Back to Index</a> | 
                    <a href="setup.html" style="color: #ff6600;">Setup Credentials</a>
                </p>
            `;
        }

        function displaySponsors() {
            const container = document.getElementById('sponsors-container');
            
            // Group by tier
            const groupedByTier = {};
            filteredSponsors.forEach(sponsor => {
                if (!groupedByTier[sponsor.tier]) {
                    groupedByTier[sponsor.tier] = [];
                }
                groupedByTier[sponsor.tier].push(sponsor);
            });
            
            let html = '';
            
            // Display each tier
            Object.keys(groupedByTier).sort((a, b) => {
                const tierOrder = {
                    'AMS25 - Title': 1,
                    'AMS25 - Moon': 2,
                    'AMS25 - 3 Block': 3,
                    'AMS25 - 2 Block': 4,
                    'AMS25 - 1 Block': 5
                };
                return (tierOrder[a] || 999) - (tierOrder[b] || 999);
            }).forEach(tier => {
                const sponsors = groupedByTier[tier];
                const tierName = tier.replace('AMS25 - ', '');
                
                html += `<h2>${tierName} (${sponsors.length})</h2>`;
                html += '<div class="sponsors-grid">';
                
                sponsors.forEach(sponsor => {
                    html += createSponsorCard(sponsor);
                });
                
                html += '</div>';
            });
            
            container.innerHTML = html || '<p style="color: #888; text-align: center; padding: 40px;">No sponsors found.</p>';
        }

        function createSponsorCard(sponsor) {
            const imageHtml = sponsor.hasImage
                ? `<img src="${sponsor.imageUrl}" alt="${sponsor.name}" class="sponsor-image" loading="lazy">`
                : `<div class="sponsor-image placeholder">No Image</div>`;
            
            const downloadBtn = sponsor.hasImage
                ? `<a href="${sponsor.imageUrl}" download="${sponsor.name}.png" class="btn btn-secondary" target="_blank">Download</a>`
                : `<button class="btn btn-secondary" disabled style="opacity: 0.5;">No Image</button>`;
            
            return `
                <div class="sponsor-card">
                    <div class="sponsor-image-container">
                        ${imageHtml}
                    </div>
                    <div class="sponsor-name">${sponsor.name}</div>
                    <div class="sponsor-tier">${sponsor.tier.replace('AMS25 - ', '')}</div>
                    <div class="sponsor-actions">
                        ${downloadBtn}
                        ${sponsor.hasImage ? `<a href="${sponsor.imageUrl}" target="_blank" class="btn">View</a>` : ''}
                    </div>
                </div>
            `;
        }

        function filterSponsors() {
            const tierFilter = document.getElementById('tier-filter').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            
            filteredSponsors = allSponsors.filter(sponsor => {
                const matchesTier = tierFilter === 'all' || sponsor.tier === tierFilter;
                const matchesSearch = sponsor.name.toLowerCase().includes(searchQuery);
                return matchesTier && matchesSearch;
            });
            
            displaySponsors();
            updateSummary();
        }

        function updateSummary() {
            const withImages = filteredSponsors.filter(s => s.hasImage).length;
            const withoutImages = filteredSponsors.filter(s => !s.hasImage).length;
            
            document.getElementById('total-count').textContent = filteredSponsors.length;
            document.getElementById('with-images-count').textContent = withImages;
            document.getElementById('without-images-count').textContent = withoutImages;
        }

        // Option 1: Download as ZIP file (BEST - single file)
        async function downloadAsZip() {
            const sponsorsWithImages = filteredSponsors.filter(s => s.hasImage);
            
            if (sponsorsWithImages.length === 0) {
                alert('No images to download in current filter.');
                return;
            }
            
            if (!confirm(`Create ZIP with ${sponsorsWithImages.length} images? This may take a minute...`)) {
                return;
            }
            
            const zipBtn = document.getElementById('zip-btn');
            const originalText = zipBtn.textContent;
            zipBtn.disabled = true;
            zipBtn.textContent = 'Creating ZIP...';
            
            try {
                const zip = new JSZip();
                const imgFolder = zip.folder("sponsor-logos");
                
                // Fetch all images and add to ZIP
                for (let i = 0; i < sponsorsWithImages.length; i++) {
                    const sponsor = sponsorsWithImages[i];
                    zipBtn.textContent = `Downloading ${i + 1}/${sponsorsWithImages.length}...`;
                    
                    try {
                        const response = await fetch(sponsor.imageUrl);
                        const blob = await response.blob();
                        
                        // Get file extension from URL or default to png
                        const urlParts = sponsor.imageUrl.split('.');
                        const ext = urlParts[urlParts.length - 1].split('?')[0] || 'png';
                        const fileName = `${sponsor.name.replace(/[^a-z0-9]/gi, '_')}.${ext}`;
                        
                        imgFolder.file(fileName, blob);
                    } catch (error) {
                        console.error(`Failed to download ${sponsor.name}:`, error);
                    }
                }
                
                // Generate ZIP and download
                zipBtn.textContent = 'Generating ZIP...';
                const content = await zip.generateAsync({type: "blob"});
                
                // Create download link
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sponsor-logos-${new Date().toISOString().split('T')[0]}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                zipBtn.textContent = 'Download Complete!';
                setTimeout(() => {
                    zipBtn.textContent = originalText;
                    zipBtn.disabled = false;
                }, 2000);
                
            } catch (error) {
                console.error('Error creating ZIP:', error);
                alert('Error creating ZIP file. Please try again or use another download method.');
                zipBtn.textContent = originalText;
                zipBtn.disabled = false;
            }
        }

        // Option 2: Download sequentially without opening tabs
        async function downloadSequentially() {
            const sponsorsWithImages = filteredSponsors.filter(s => s.hasImage);
            
            if (sponsorsWithImages.length === 0) {
                alert('No images to download in current filter.');
                return;
            }
            
            if (!confirm(`Download ${sponsorsWithImages.length} images one by one? Check your downloads folder.`)) {
                return;
            }
            
            for (let i = 0; i < sponsorsWithImages.length; i++) {
                const sponsor = sponsorsWithImages[i];
                
                try {
                    const response = await fetch(sponsor.imageUrl);
                    const blob = await response.blob();
                    
                    const urlParts = sponsor.imageUrl.split('.');
                    const ext = urlParts[urlParts.length - 1].split('?')[0] || 'png';
                    const fileName = `${sponsor.name.replace(/[^a-z0-9]/gi, '_')}.${ext}`;
                    
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    // Small delay to avoid overwhelming browser
                    await new Promise(resolve => setTimeout(resolve, 300));
                } catch (error) {
                    console.error(`Failed to download ${sponsor.name}:`, error);
                }
            }
            
            alert('Downloads complete! Check your downloads folder.');
        }

        // Option 3: Export URL list as text file
        function exportUrlList() {
            const sponsorsWithImages = filteredSponsors.filter(s => s.hasImage);
            
            if (sponsorsWithImages.length === 0) {
                alert('No images to export in current filter.');
                return;
            }
            
            // Create text content with URLs and filenames
            let content = '# Sponsor Logo URLs\n';
            content += `# Generated: ${new Date().toISOString()}\n`;
            content += `# Total: ${sponsorsWithImages.length} images\n\n`;
            
            sponsorsWithImages.forEach(sponsor => {
                const urlParts = sponsor.imageUrl.split('.');
                const ext = urlParts[urlParts.length - 1].split('?')[0] || 'png';
                const fileName = `${sponsor.name.replace(/[^a-z0-9]/gi, '_')}.${ext}`;
                content += `# ${sponsor.name} (${sponsor.tier.replace('AMS25 - ', '')})\n`;
                content += `${sponsor.imageUrl}\n`;
                content += `# Save as: ${fileName}\n\n`;
            });
            
            // Add wget/curl commands
            content += '\n\n# === WGET COMMANDS ===\n';
            content += '# Copy and paste these commands to download all images:\n\n';
            sponsorsWithImages.forEach(sponsor => {
                const urlParts = sponsor.imageUrl.split('.');
                const ext = urlParts[urlParts.length - 1].split('?')[0] || 'png';
                const fileName = `${sponsor.name.replace(/[^a-z0-9]/gi, '_')}.${ext}`;
                content += `wget -O "${fileName}" "${sponsor.imageUrl}"\n`;
            });
            
            // Create download
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sponsor-urls-${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert(`URL list exported! You can use wget or curl to download all images.\n\nExample:\nwget -i sponsor-urls-${new Date().toISOString().split('T')[0]}.txt`);
        }

        // Option 4: Copy URLs to clipboard
        async function copyUrlsToClipboard() {
            const sponsorsWithImages = filteredSponsors.filter(s => s.hasImage);
            
            if (sponsorsWithImages.length === 0) {
                alert('No images to copy in current filter.');
                return;
            }
            
            const urls = sponsorsWithImages.map(s => s.imageUrl).join('\n');
            
            try {
                await navigator.clipboard.writeText(urls);
                alert(`Copied ${sponsorsWithImages.length} image URLs to clipboard!\n\nYou can now paste them into:\n- Download manager\n- Text editor\n- Terminal (with wget/curl)`);
            } catch (error) {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = urls;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert(`Copied ${sponsorsWithImages.length} image URLs to clipboard!`);
            }
        }

        // Load sponsors on page load
        document.addEventListener('DOMContentLoaded', fetchSponsors);
    </script>
</body>
</html>
